plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
def hasReleaseSigning = keystorePropertiesFile.exists()
if (hasReleaseSigning) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace "com.foysol.jarvis"
    compileSdkVersion 36
    ndkVersion "28.2.13676358"
    compileOptions {
        coreLibraryDesugaringEnabled = true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        aidl true
        buildConfig true
    }
    defaultConfig {
        applicationId "com.foysol.jarvis"
        minSdkVersion 26
        targetSdkVersion 36
        versionCode flutter.versionCode
        versionName flutter.versionName
        multiDexEnabled true
        ndk {
            abiFilters "arm64-v8a"
        }
    }
    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(keystoreProperties["storeFile"])
                storePassword keystoreProperties["storePassword"]
                keyAlias keystoreProperties["keyAlias"]
                keyPassword keystoreProperties["keyPassword"]
            }
        }
    }
    buildTypes {
        release {
            signingConfig hasReleaseSigning ? signingConfigs.release : signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }
}

androidComponents {
    finalizeDsl { extension ->
        extension.defaultConfig.ndk.abiFilters.clear()
        extension.defaultConfig.ndk.abiFilters.addAll(["arm64-v8a"])
    }
}

flutter {
    source '../..'
}
dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.2.20"
    implementation "androidx.appcompat:appcompat:1.8.0"
    implementation "androidx.multidex:multidex:2.0.1"
    implementation "androidx.core:core-ktx:1.18.0"
    implementation "androidx.work:work-runtime-ktx:2.12.0"
    implementation "androidx.biometric:biometric:1.1.0"
    implementation "dev.rikka.shizuku:api:13.1.5"
    implementation "dev.rikka.shizuku:provider:13.1.5"
}
